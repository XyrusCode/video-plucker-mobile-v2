# GitLab CI — mirrors the old GitHub Actions pipeline (Expo prebuild → Gradle → release).
# The project moved here after GitHub Actions minutes ran out.
#
# Pipeline rules:
#   - pushes to `main`  → debug-build + release-build in parallel. release-build exists so a
#                         tag can ship without rebuilding (reuse, not rebuild).
#   - pushes of tags `v*` → release only — NO rebuild. It reuses the signed release APK
#                           from the last successful `main` release-build.
#
# Reuse flow:
#   1. Push the release commit to `main` → debug-build and release-build run in parallel;
#      release-build artifacts include the signed release APK + Sentry source maps.
#   2. Once they are green, push the `v*` tag → the release job downloads those artifacts
#      from the last successful `main` pipeline, publishes (generic package + GitLab
#      Release + R2 mirror), then purges the reused build artifacts. R2 and the package
#      registry keep every released APK, so nothing else needs preserving.
#
# Debug and release are SEPARATE jobs (not one job building both) so each runner only holds
# one variant's C++/build outputs — a single job doing both blew the shared runner's disk
# ("No space left on device"). The `.gradle` cache is trimmed to deps + wrapper only
# (not full transforms/build-cache) to keep the build dir lean.
#
# Project CI/CD variables (Settings → CI/CD → Variables, masked where sensitive):
#   GOOGLE_SERVICES_JSON      base64 of google-services.json (optional; committed placeholder used otherwise)
#   SENTRY_AUTH_TOKEN         for source-map uploads (optional)
#   CLOUDFLARE_API_TOKEN      R2 mirror (optional)
#   CLOUDFLARE_ACCOUNT_ID     R2 mirror (optional)

image: node:22

stages:
  - build
  - release

variables:
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "main"'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .gradle/wrapper/
    - .gradle/caches/modules-2/

# One-time per-job toolchain: JDK 17 + Android cmdline-tools with accepted licenses.
# AGP downloads the exact platform/build-tools it needs once licenses are accepted.
before_script:
  - apt-get update -qq > /dev/null 2>&1
  - apt-get install -y -qq openjdk-17-jdk-headless unzip jq > /dev/null 2>&1
  - export JAVA_HOME="$(dirname $(dirname $(readlink -f $(which javac))))"
  - if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
      mkdir -p "$ANDROID_SDK_ROOT";
      curl -sSLo /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip;
      unzip -q /tmp/ct.zip -d /tmp/ct;
      mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools";
      mv /tmp/ct/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest";
      (yes || true) | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1;
    fi

debug-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci
    - if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json; fi
    - npx expo prebuild --platform android --no-install
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
    - cd android && ./gradlew assembleDebug --console=plain && cd ..
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days

release-build:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci
    - if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json; fi
    - npx expo prebuild --platform android --no-install
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
    # Signed release APK reused by the tag release job (no rebuild on tags).
    - cd android && ./gradlew assembleRelease --console=plain && cd ..
    # Emit a single universal APK for in-app updater & website links, matching V1.
    - cd android && ./gradlew assembleRelease -PnoAbiSplits --console=plain && cd ..
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/*.apk
      # Reused by the release job's Sentry upload; purged after a successful release.
      - android/app/build/generated/assets/createBundleReleaseJsAndAssets/
      - android/app/build/generated/sourcemaps/react/release/
    expire_in: 30 days

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - apt-get update -qq > /dev/null 2>&1
    - apt-get install -y -qq unzip jq > /dev/null 2>&1
  script:
    # 0) Reuse the signed release APK + source maps from the last successful main release-build.
    - |
      pipeline_id="$(curl -sS --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?ref=main&sha=$CI_COMMIT_SHA&status=success&per_page=1" \
        | jq -r '.[0].id // empty')"
      if [ -z "$pipeline_id" ]; then
        pipeline_id="$(curl -sS --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?ref=main&status=success&per_page=1" \
          | jq -r '.[0].id // empty')"
      fi
      if [ -z "$pipeline_id" ]; then
        echo "No successful main release-build found to reuse. Push main first so release-build goes green, then push the tag." >&2
        exit 1
      fi
      job_id="$(curl -sS --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$pipeline_id/jobs?scope[]=success" \
        | jq -r '.[] | select(.name=="release-build") | .id // empty')"
      if [ -z "$job_id" ]; then
        echo "release-build job not found in pipeline $pipeline_id." >&2
        exit 1
      fi
      echo "Reusing artifacts from release-build job $job_id (pipeline $pipeline_id)."
      curl -sS -L --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" -o release-build-artifacts.zip \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$job_id/artifacts"
      unzip -qo release-build-artifacts.zip
    - ls android/app/build/outputs/apk/release/*.apk >/dev/null
    - mkdir -p dist && cp android/app/build/outputs/apk/release/*.apk dist/
    - # Rename universal APK to consistent name across mirrors
    - if [ -f dist/app-release.apk ]; then mv dist/app-release.apk dist/app-universal-release.apk; fi
    - VERSION="${CI_COMMIT_TAG#v}"
    # Extract this version's CHANGELOG section into release-notes.md (heading may carry a date suffix).
    - awk -v v="$VERSION" '/^## \[/ { if (on) exit; if ($0 ~ "^## \\[" v "\\]") on=1 } on { print }' CHANGELOG.md > release-notes.md
    # 1) Publish each per-ABI APK to the generic package registry (public when the project is public).
    - for apk in dist/*.apk; do curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$apk" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/video-plucker/$VERSION/$(basename "$apk")"; done
    # 2) Create the GitLab Release pointing at the per-ABI packages.
    - |
      curl -sSLo /usr/local/bin/release-cli https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-linux-amd64 && chmod +x /usr/local/bin/release-cli
      args=(create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --ref "$CI_COMMIT_TAG" --description-file release-notes.md)
      for apk in dist/*.apk; do
        name="$(basename "$apk")"
        args+=(--assets-link --name "$name" --url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/video-plucker/$VERSION/$name" --link-type package)
      done
      release-cli "${args[@]}"
    # 3) Sentry source maps (optional; best-effort) from the reused build.
    - if [ -n "$SENTRY_AUTH_TOKEN" ]; then
        RELEASE="$VERSION";
        export SENTRY_ORG=xyrus-code SENTRY_PROJECT=video-plucker;
        npx --yes @sentry/cli@latest releases new "$RELEASE" --finalize false || true;
        npx --yes @sentry/cli@latest releases set-commits "$RELEASE" --auto || true;
        npx --yes @sentry/cli@latest releases files "$RELEASE" upload-sourcemaps android/app/build/generated/assets/createBundleReleaseJsAndAssets android/app/build/generated/sourcemaps/react/release --ext map || true;
        npx --yes @sentry/cli@latest releases finalize "$RELEASE" || true;
      fi
    # 4) Mirror the APK to Cloudflare R2 (optional; best-effort). R2 keeps every version.
    - if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
        for apk in dist/*.apk; do
          npx --yes wrangler@4 r2 object put "video-plucker-releases/mobile/$VERSION/$(basename "$apk")" --file "$apk" --remote || true;
        done
      fi
    # 5) Purge the reused build artifacts. R2 + package registry retain this release's APK,
    #    so old debug/release APKs + source maps no longer need preserving.
    - |
      for pid in $(curl -sS --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines?ref=main&status=success&per_page=20" \
        | jq -r '.[].id'); do
        for jid in $(curl -sS --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$pid/jobs" \
          | jq -r '.[].id'); do
          curl -sS -o /dev/null --request DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$jid/artifacts" || true
        done
      done
  artifacts:
    name: "$CI_COMMIT_TAG"
    paths:
      - dist/
    expire_in: 30 days
