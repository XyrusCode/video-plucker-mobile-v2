name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set — using committed placeholder (remote config defaults at runtime)."
          fi

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/app-universal-release.apk

      - name: Upload Sentry source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: xyrus-code
          SENTRY_PROJECT: video-plucker
        run: |
          RELEASE="${GITHUB_REF_NAME#v}"
          npx --yes @sentry/cli@latest releases new "$RELEASE" --finalize false
          npx --yes @sentry/cli@latest releases set-commits "$RELEASE" --auto
          npx --yes @sentry/cli@latest releases files "$RELEASE" upload-sourcemaps \
            android/app/build/generated/assets/createBundleReleaseJsAndAssets \
            android/app/build/generated/sourcemaps/react/release --ext map
          npx --yes @sentry/cli@latest releases finalize "$RELEASE"

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - <<'EOF'
          import re
          version = "${{ github.ref_name }}".lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'^## \[{re.escape(version)}\]\s*$.*?(?=^## \[|\Z)', text, re.M | re.S) or re.search(rf'^## \[{re.escape(version)}\].*$.*?(?=^## \[|\Z)', text, re.M | re.S)
          notes = m.group(0).strip() if m else ''
          open('release-notes.md', 'w', encoding='utf-8').write(notes)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release-notes.md
          generate_release_notes: true

      - name: Mirror to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put "video-plucker-releases/mobile/v${GITHUB_REF_NAME#v}/app-universal-release.apk" --file dist/app-universal-release.apk --remote
        continue-on-error: true