name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find last successful Android Build run on main
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/android-build.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || true)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful run at $GITHUB_SHA — falling back to latest successful android-build on main."
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/android-build.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id' 2>/dev/null || true)
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Android Build run on main to reuse. Push main so the build goes green, then push the tag." >&2
            exit 1
          fi
          echo "Reusing Android Build run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download release APK + source maps
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: reuse
          github-token: ${{ github.token }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find reuse -type f -name 'app-release.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::app-release.apk not found under reuse/"
            find reuse -maxdepth 8 -type d | head -100
            exit 1
          fi
          cp "$APK" dist/app-universal-release.apk
          echo "Collected APK from: $APK"

      - name: Upload Sentry source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: xyrus-code
          SENTRY_PROJECT: video-plucker
        run: |
          RELEASE="${GITHUB_REF_NAME#v}"
          JS_DIR=$(find reuse -type d -name createBundleReleaseJsAndAssets | head -n 1)
          MAP_DIR=$(find reuse -type d -path '*sourcemaps/react/release' | head -n 1)
          if [ -z "$JS_DIR" ] || [ -z "$MAP_DIR" ]; then
            echo "Source maps not found under reuse/; skipping source map upload."
            exit 0
          fi
          npx --yes @sentry/cli@latest releases new "$RELEASE" --finalize false
          npx --yes @sentry/cli@latest releases set-commits "$RELEASE" --auto
          npx --yes @sentry/cli@latest releases files "$RELEASE" upload-sourcemaps \
            "$JS_DIR" "$MAP_DIR" --ext map
          npx --yes @sentry/cli@latest releases finalize "$RELEASE"

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - <<'EOF'
          import re
          version = "${{ github.ref_name }}".lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'^## \[{re.escape(version)}\]\s*$.*?(?=^## \[|\Z)', text, re.M | re.S) or re.search(rf'^## \[{re.escape(version)}\].*$.*?(?=^## \[|\Z)', text, re.M | re.S)
          notes = m.group(0).strip() if m else ''
          open('release-notes.md', 'w', encoding='utf-8').write(notes)
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Mirror to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put "video-plucker-releases/mobile/v${GITHUB_REF_NAME#v}/app-universal-release.apk" --file dist/app-universal-release.apk --remote
        continue-on-error: true

      - name: Purge stale build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The released APK lives on the GitHub Release and R2, so the per-build
          # workflow artifacts (debug/release APKs + source maps) can be purged.
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | .id' | while read -r id; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 || true
          done
