name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set — using committed placeholder (remote config defaults at runtime)."
          fi

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug + release APKs
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # The signed release APK is built here too so a tag release can reuse it
          # without rebuilding (see release.yml).
          ./gradlew assembleDebug assembleRelease --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK + source maps
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/generated/assets/createBundleReleaseJsAndAssets
            android/app/build/generated/sourcemaps/react/release
          if-no-files-found: warn
